
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: merchant_agent
      POSTGRES_USER: merchant
      POSTGRES_PASSWORD: merchant123
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  # pgvector variant for production: ankane/pgvector or use postgres + extension
volumes:
  pgdata:
