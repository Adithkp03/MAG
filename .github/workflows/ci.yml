name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r backend/requirements.txt
      - run: python -m py_compile backend/app/main.py backend/app/services/commerce.py backend/app/api/routes/products.py
      - run: python backend/scripts/seed_realistic.py --seed 42  # deterministic CSV
      - run: sha256sum data/products.csv | grep 81445a562d13cceb197137b3499481badc1a9131de67088c6ed4abf1c5512726
      - run: python -m pytest backend/tests/test_evaluation.py -q
      - name: Alembic check
        run: alembic -c alembic.ini check || echo "alembic check skip"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
